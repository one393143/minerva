<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極限棒球陣容大師 - 使用者登入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .user-card {
      transition: all 0.3s ease;
    }
    .user-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.6s ease-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-2xl w-full animate-fade-in">
    <!-- Logo & Title -->
    <div class="text-center mb-12">
      <div class="text-6xl mb-4">⚾</div>
      <h1 class="text-5xl font-black text-white mb-2 tracking-tight">
        極限棒球陣容大師
      </h1>
      <p class="text-xl text-purple-200 font-bold">Pro Manager</p>
    </div>

    <!-- User Selection Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12">
      <h2 class="text-2xl font-black text-gray-800 mb-8 text-center">
        請選擇您的身份
      </h2>

      <!-- User Grid -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
        <button onclick="selectUser('建德')" class="user-card bg-gradient-to-br from-blue-400 to-blue-600 text-white rounded-2xl p-6 font-black text-xl shadow-lg">
          <div class="text-4xl mb-2">👨‍💼</div>
          建德
        </button>
        <button onclick="selectUser('智明')" class="user-card bg-gradient-to-br from-green-400 to-green-600 text-white rounded-2xl p-6 font-black text-xl shadow-lg">
          <div class="text-4xl mb-2">🧑‍🎓</div>
          智明
        </button>
        <button onclick="selectUser('昌慈')" class="user-card bg-gradient-to-br from-purple-400 to-purple-600 text-white rounded-2xl p-6 font-black text-xl shadow-lg">
          <div class="text-4xl mb-2">👨‍💻</div>
          昌慈
        </button>
        <button onclick="selectUser('俊廷')" class="user-card bg-gradient-to-br from-orange-400 to-orange-600 text-white rounded-2xl p-6 font-black text-xl shadow-lg">
          <div class="text-4xl mb-2">🧑‍🔬</div>
          俊廷
        </button>
        <button onclick="selectUser('冠榮')" class="user-card bg-gradient-to-br from-red-400 to-red-600 text-white rounded-2xl p-6 font-black text-xl shadow-lg">
          <div class="text-4xl mb-2">👨‍🏫</div>
          冠榮
        </button>
        <button onclick="selectUser('訪客')" class="user-card bg-gradient-to-br from-gray-400 to-gray-600 text-white rounded-2xl p-6 font-black text-xl shadow-lg">
          <div class="text-4xl mb-2">👤</div>
          訪客
        </button>
      </div>

      <!-- Info Text -->
      <p class="text-sm text-gray-500 text-center mt-6">
        選擇身份後將進入陣容管理系統
      </p>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8 text-white text-sm opacity-75">
      <p>© 2026 極限棒球隊 | Powered by Firebase</p>
    </div>
  </div>

  <script type="module">
    import { setCurrentUser } from './js/user-service.js';

    window.selectUser = function(userName) {
      setCurrentUser(userName);
      window.location.href = 'app.html';
    };
  </script>
</body>
</html>
